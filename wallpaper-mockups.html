<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMBoard — ターミナル背景 壁紙 仮案</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#141414; color:#e8e8e8;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding:32px;
  }
  h1 { font-size:15px; font-weight:600; letter-spacing:.02em; margin-bottom:6px; }
  .sub { font-size:12px; color:#8a8a8a; margin-bottom:24px; line-height:1.6; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px,1fr)); gap:22px; }
  .tile { border-radius:14px; overflow:hidden; border:1px solid #262626; background:#0a0a0a; }
  .stage { position:relative; height:230px; overflow:hidden; }
  .wall { position:absolute; inset:0; }
  /* frosted パネル（右側）＝実際の見え方を再現 */
  .panel {
    position:absolute; top:0; right:0; bottom:0; width:52%;
    background:rgba(14,12,14,0.42);
    -webkit-backdrop-filter:blur(30px) saturate(1.35);
    backdrop-filter:blur(30px) saturate(1.35);
    border-left:1px solid rgba(255,255,255,0.07);
    box-shadow:-20px 0 60px rgba(0,0,0,0.25);
    padding:14px 16px;
    font-family:"SF Mono", ui-monospace, monospace; font-size:10.5px; line-height:1.8; color:#c9c6c0;
  }
  .panel .g { color:#7fdca0; }
  .panel .d { color:#6b6b6b; }
  .label { padding:11px 14px; display:flex; justify-content:space-between; align-items:center;
           border-top:1px solid #1e1e1e; }
  .name { font-size:12.5px; font-weight:600; }
  .cmd  { font-family:"SF Mono", ui-monospace, monospace; font-size:10px; color:#7a7a7a; }

  /* ═══ 各案の壁紙 ═══ */

  /* 01 月＋星（現行案） */
  .w-moon { background:
      radial-gradient(120% 80% at 70% 8%, #141b26 0%, #0c0f16 42%, #07080c 78%),
      linear-gradient(180deg,#090b11,#060608); }
  .w-moon::before { content:''; position:absolute; top:12%; right:14%; width:38%; aspect-ratio:1;
      border-radius:50%;
      background:radial-gradient(circle at 38% 34%, #fdfcf7 0%, #e9e6db 30%, #b9b4a3 58%, #7c7869 78%, #4a4740 100%);
      box-shadow:0 0 40px 10px rgba(240,238,228,.10), 0 0 120px 40px rgba(190,200,225,.08), 0 0 260px 120px rgba(120,140,190,.05); }
  .w-moon::after { content:''; position:absolute; inset:0;
      background-image:
        radial-gradient(1.4px 1.4px at 22% 30%, rgba(255,255,255,.5), transparent 60%),
        radial-gradient(1.1px 1.1px at 40% 62%, rgba(255,255,255,.4), transparent 60%),
        radial-gradient(1.6px 1.6px at 30% 22%, rgba(255,255,255,.45), transparent 60%),
        radial-gradient(1.0px 1.0px at 18% 78%, rgba(255,255,255,.35), transparent 60%),
        radial-gradient(1.3px 1.3px at 45% 88%, rgba(255,255,255,.4), transparent 60%); }

  /* 02 右上ライトのみ（極ミニマル・今のイメージ） */
  .w-min { background:
      radial-gradient(90% 70% at 92% 6%, #23252b 0%, #121317 40%, #0a0a0c 80%),
      #08080a; }

  /* 03 ディープレッド星雲（Raycastの提示画像イメージ） */
  .w-red { background:
      radial-gradient(120% 90% at 85% 15%, #3a1620 0%, #1c0c11 40%, #0a0708 80%),
      linear-gradient(120deg,#0a0708,#120a0c); }
  .w-red::after { content:''; position:absolute; inset:-20%;
      background-image:
        repeating-linear-gradient(58deg, transparent 0 42px, rgba(220,70,80,.06) 42px 43px),
        repeating-linear-gradient(-32deg, transparent 0 66px, rgba(130,90,110,.04) 66px 67px);
      -webkit-mask-image:radial-gradient(80% 70% at 82% 22%, #000, transparent 75%);
      mask-image:radial-gradient(80% 70% at 82% 22%, #000, transparent 75%); }

  /* 04 オーロラ（緑〜紫の光） */
  .w-aurora { background:
      radial-gradient(80% 60% at 25% 15%, rgba(60,200,150,.22), transparent 60%),
      radial-gradient(70% 60% at 80% 40%, rgba(120,90,220,.22), transparent 62%),
      radial-gradient(90% 80% at 60% 100%, rgba(40,120,200,.16), transparent 70%),
      #07080c; }

  /* 05 メッシュグラデ（青〜藍のブロブ） */
  .w-mesh { background:
      radial-gradient(50% 45% at 20% 25%, rgba(70,110,220,.28), transparent 60%),
      radial-gradient(45% 45% at 78% 20%, rgba(150,80,200,.22), transparent 60%),
      radial-gradient(55% 55% at 65% 85%, rgba(40,160,190,.20), transparent 62%),
      radial-gradient(40% 40% at 12% 80%, rgba(90,70,200,.18), transparent 60%),
      #06070b; filter:saturate(1.05); }

  /* 06 単色ブラック＋ヘアライングリッド（BMBoardらしい硬派） */
  .w-grid { background:
      radial-gradient(100% 80% at 80% 10%, #1a1a1e 0%, #0c0c0e 45%, #070708 82%),
      #070708; }
  .w-grid::after { content:''; position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
      background-size:34px 34px;
      -webkit-mask-image:radial-gradient(90% 80% at 75% 20%, #000, transparent 80%);
      mask-image:radial-gradient(90% 80% at 75% 20%, #000, transparent 80%); }

  /* 07 琵琶湖の夜（木下スタジオ文脈・深い藍＋水面の光） */
  .w-biwa { background:
      radial-gradient(100% 70% at 60% 0%, #12233a 0%, #0a1420 45%, #060a10 82%),
      linear-gradient(180deg,#081018,#05070b); }
  .w-biwa::after { content:''; position:absolute; left:0; right:0; bottom:0; height:45%;
      background:
        repeating-linear-gradient(0deg, transparent 0 6px, rgba(120,160,210,.05) 6px 7px);
      -webkit-mask-image:linear-gradient(180deg, transparent, #000);
      mask-image:linear-gradient(180deg, transparent, #000); }

  /* 08 サンセット・グロー（暖色1点光） */
  .w-sunset { background:
      radial-gradient(90% 80% at 88% 90%, #4a2418 0%, #241210 38%, #0a0708 80%),
      radial-gradient(60% 50% at 20% 10%, rgba(90,70,120,.15), transparent 60%),
      #08070a; }
</style>
</head>
<body>
  <h1>BMBoard — ターミナル背景 壁紙 仮案</h1>
  <p class="sub">
    黒ベース＋グラデーション。各案の右側は実際の frosted glass パネル（blur30・不透明度0.42）で当て込み済み。<br>
    ⭐最終的な背景グラフィックは木下が作る前提の「仮」。方向・色・光の置き方を選ぶためのもの。
  </p>
  <div class="grid" id="grid"></div>

<script>
  const panelHTML = `
    <div class="panel">
      <div><span class="g">blackmirror</span> — bash</div>
      <div class="d">Draw. Pan. Save.</div>
      <div style="margin-top:8px;"><span class="d">$</span> paper</div>
      <div class="g">→ 紙のノートに切り替え</div>
      <div style="margin-top:8px;"><span class="d">$</span> 6b</div>
      <div class="g">→ 鉛筆: 6B</div>
      <div style="margin-top:10px;" class="d">❯ type a command…</div>
    </div>`;
  const cases = [
    ['w-moon',   '01 月＋星',            'wall moon'],
    ['w-min',    '02 右上ライトのみ',     'wall minimal'],
    ['w-red',    '03 ディープレッド星雲', 'wall nebula'],
    ['w-aurora', '04 オーロラ',          'wall aurora'],
    ['w-mesh',   '05 メッシュグラデ',     'wall mesh'],
    ['w-grid',   '06 ヘアライングリッド', 'wall grid'],
    ['w-biwa',   '07 琵琶湖の夜',        'wall biwa'],
    ['w-sunset', '08 サンセットグロー',   'wall sunset'],
  ];
  document.getElementById('grid').innerHTML = cases.map(([cls,name,cmd]) => `
    <div class="tile">
      <div class="stage">
        <div class="wall ${cls}"></div>
        ${panelHTML}
      </div>
      <div class="label"><span class="name">${name}</span><span class="cmd">${cmd}</span></div>
    </div>`).join('');
</script>
</body>
</html>
