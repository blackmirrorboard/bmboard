<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>OG source — 1200×630</title>
<style>
/* ⭐OG画像（SNSで共有された時に出る絵）の元。
   ここをブラウザで開いて 1200×630 で撮る → og-image.png に置き換える。
   ⚠️手で画像を作らずこのファイルを撮るのは、KVやコピーを変えた時に作り直せるようにするため。
   撮り方: node で 1200×630・deviceScaleFactor 2 → cwebp/pngquant は使わず PNG のまま
          （OGはPNG/JPGのみ。WebPは一部のSNSで表示されない） */
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#08080a;
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
  -webkit-font-smoothing:antialiased}
/* KVはサイトのヒーローと同じ見え方に（少し広げて中央） */
.kv{position:absolute;left:-18%;top:-18%;width:136%;height:136%;
  background:url('../kv/kv-hero.webp') center center / cover no-repeat}
.brand{position:absolute;left:54px;top:46px;display:flex;align-items:center;gap:16px;
  font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:23px;font-weight:700;
  letter-spacing:.2em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.9)}
.brand img{width:42px;height:42px;filter:invert(1)}
.copy{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;color:#fff}
h1{font-size:78px;font-weight:700;letter-spacing:-.035em;line-height:1.2;
  filter:drop-shadow(0 4px 24px rgba(0,0,0,.95)) drop-shadow(0 1px 6px rgba(0,0,0,.85))}
.sub{margin-top:24px;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:18px;
  letter-spacing:.12em;color:rgba(255,255,255,.8);text-shadow:0 2px 12px rgba(0,0,0,.9)}
.foot{position:absolute;left:0;right:0;bottom:46px;text-align:center;
  font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.12em;
  color:rgba(255,255,255,.62);text-shadow:0 2px 10px rgba(0,0,0,.9)}
</style>
</head>
<body>
  <div class="kv"></div>
  <div class="brand"><img src="../logo.png" alt="">BM BOARD</div>
  <div class="copy">
    <h1>手で書く。<br>キーで動かす。</h1>
    <p class="sub">Write by hand. Move at speed.</p>
  </div>
  <p class="foot">bmboard.studio &nbsp;·&nbsp; one file &nbsp;·&nbsp; works offline &nbsp;·&nbsp; free</p>
</body>
</html>
