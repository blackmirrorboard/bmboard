name: チェック / Checks

# app.html を触ったら毎回まわす軽い検査。
# ⚠️狙いは「静かに壊れる」種類のバグを機械で止めること。
on:
  push:
    paths: ['app.html', 'usage.html', 'commands.html', 'story.html', 'dev-log.html', 'store.html', '.github/data/**', 'store/catalog.json', '.github/scripts/**', '.github/workflows/checks.yml']
  pull_request:
    paths: ['app.html', 'usage.html', 'commands.html', 'story.html', 'dev-log.html', 'store.html', '.github/data/**', 'store/catalog.json', '.github/scripts/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ⭐同名コマンドの重複＝後から足した方が前の実装を黙って殺す事故。
      #   2026-07-24 の1日で3件（align / board / dark）発生したので機械で止める。
      - name: コマンド名の重複を見る
        run: node .github/scripts/check-command-dups.mjs

      # ⭐公開ページ usage.html は app.html の USAGE_DOC から生成している。
      #   手書きだった頃、片方だけ育って公開ページが2ヶ月止まった（⌘K も鉛筆も載っていなかった）。
      #   生成物が古いまま push されたらここで落とす。
      - name: usage.html が USAGE_DOC とズレていないか見る
        run: node .github/scripts/build-usage.mjs --check

      # ⭐commands.html も同じ理由で生成物。手書きだった頃 2026-05-08 で止まっていた。
      - name: commands.html が OMNI_CMDS とズレていないか見る
        run: node .github/scripts/build-commands.mjs --check

      # ⭐story.html は本文もスクリプト側が正（手で書き換えると次の生成で消える）
      - name: story.html が生成物と一致しているか見る
        run: node .github/scripts/build-story.mjs --check

      # ⭐dev-log は .github/data/dev-log.json が正（エントリはそこに足す）
      - name: dev-log.html が生成物と一致しているか見る
        run: node .github/scripts/build-devlog.mjs --check

      # ⭐STORE はアプリと同じ store/catalog.json を読む（二重管理にしない）
      - name: store.html が catalog.json とズレていないか見る
        run: node .github/scripts/build-store.mjs --check

      - name: JS の構文を見る
        run: |
          node -e '
            const fs=require("fs");
            const src=fs.readFileSync("app.html","utf8");
            const blocks=[...src.matchAll(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
            try { new Function(blocks.join("\n;\n")); console.log("JS構文OK ("+blocks.length+"ブロック)"); }
            catch(e){ console.error("構文エラー: "+e.message); process.exit(1); }
          '

      - name: STORE カタログが壊れていないか見る
        run: |
          node -e '
            const fs=require("fs");
            const OPS=["square","sticky","text","circle","triangle","arrow"];
            const cat=JSON.parse(fs.readFileSync("store/catalog.json","utf8"));
            const sp=cat.spells||cat;
            const names=new Set(); let bad=0;
            for(const s of sp){
              if(!s.name){ console.error("nameが無いエントリがあります"); bad++; continue; }
              if(names.has(s.name)){ console.error("名前が重複: "+s.name); bad++; }
              names.add(s.name);
              if(Array.isArray(s.ops)) for(const o of s.ops)
                if(!OPS.includes(o.type)){ console.error(`${s.name}: 許可されていない type "${o.type}"`); bad++; }
              if(!s.ops && !s.action && !s.objects){ console.error(s.name+": ops/action/objects のどれも無い"); bad++; }
            }
            if(bad){ process.exit(1); }
            console.log("カタログOK ("+sp.length+"件)");
          '
