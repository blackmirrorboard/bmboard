---

A terminal-driven infinite canvas. One HTML file. No dependencies. No build.
Every draw action speaks back through a live shell. Every command is a spell —
JSON-portable, shareable, remixable. **v1.2 ships 2026-04-19.**

```
open app.html
```

That's the install. Or visit the live build:

```
https://bmboard.studio/app
```

## What's new in v1.2

```
FETCH-IMG (refresh) keyword-based image summoning via Lorem Flickr
                    `fetch-img mountain 6` → 6 photos · auto 3×2 grid
                    color by default · mono by opt-in via $ monoclo
                    no API key · up to 25 images per call

MONOCLO (new)       `monoclo` → grayscale the selected image(s)
                    undo-safe · dataURL persisted · bundle-safe
                    shape/stroke objects ignored

SVG EXPORT (new)    `$ svg` → selection (or all) as editable vector SVG
                    standalone .svg file with explicit viewBox
                    opens in Illustrator / Figma / Inkscape as layered shapes
                    ellipse · rect · polygon · path · text · image · arrow
                    theme colors resolved on write · rotation → <g rotate(...)>

EXPORT UX           export              → selection as transparent PNG
                    export magic        → picker modal (per-spell checkboxes)
                    export data         → bundle dialog (canvas/user/preset toggles)
                    share <name>        → single spell to clipboard

IMPORT UX           drag-and-drop .json anywhere on board
                    auto-detects 4 payload shapes (single / array / spells / bundle)
                    collision-safe: same name → renamed `<name>_2026-04-19`
                    presets protected · identical actions skipped

BUNDLE DIALOG       incoming bundle shows an overwrite / add / cancel modal
                    merge mode re-IDs incoming objects to avoid collisions

STROKE-COLOR FIX    per-object `obj.data.stroke` now honored by pencil strokes
                    `$ biwako-blue` finally tints freehand lines too
```

---

## Philosophy

**Intuition over syntax.** Draw a shape. The terminal answers.

**Subtractive.** One file. Zero deps. Zero build. If it doesn't need to exist, it doesn't.

**Local-first.** No cloud. No auth. Export is PNG or JSON. Your file, your disk.

**Portable spells.** Any command you invent is a JSON payload. Paste it on SNS, someone pastes it into their board, and your magic runs on their canvas.

## Features

```

                 pointer events unified across mouse / touch / pen
                 DPR-scaled ctx.setTransform · 60fps redraws

SELECT · MOVE    click body or within 8px of line · drag to move
                 hover glow · cursor: move / nwse-resize / ns-resize
                 marquee: dashed box · intersection-aware

EDIT             8-handle bbox · per-vertex anchors on pen/triangle/path
                 rotation ring above the bbox (Illustrator feel)
                 Shift lock-aspect · Alt center-pin · Shift+Alt both
                 0.5× / 1× / 1.5× / 2× snap milestones

PEN → PATH       freehand → RDP simplify on lift (≤ ~12 anchors)
                 dense pts kept internally for smooth curves
                 auto-close: draw back to origin → blue snap ring

FILL + LINE      fill: none / black / grey / white
                 line: on / off (no outline, closed shapes only)
                 per-object stroke color overrides theme color

THEMES           light : surface #FAFAF8 · ink #0c0c0c
                 dark  : void    #000000 · ink #F0EDE6
                 gray  : pebble  #DCDBD5 · ink #1600A2
                 swap via terminal: `light` | `dark` | `gray`

IMAGES           upload from disk (I key) · dropped photos
                 fetch-img <kw> <n> summons color photos
                 monoclo retroactively grayscales any selected image

SPELLS           register <name> <js>   create a spell
                 share <name>           copy JSON to clipboard
                 alias <new>=<old>      duplicate under a new name
                 forget <name>          delete a user spell
                 list                   inventory (preset / user)

IMPORT           paste JSON → auto-register · D&D .json file → same
                 4 payload shapes recognized automatically
                 name collisions → <name>_2026-04-19 auto-rename

EXPORT           X key or `export`       → transparent PNG (selection-aware)
                 `export magic`          → spell picker modal
                 `export data`           → bundle dialog (canvas/user/preset)
                 `share <name>`          → single spell to clipboard

PERSISTENCE      IndexedDB (projects + spells) · localStorage (history)
                 `save <name>` / `ls` / `load <name>` for named snapshots

UNDO · REDO      Cmd+Z · Cmd+Shift+Z · 60-state history

PAN · ZOOM       Space+drag · pinch · scroll-wheel · double-tap reset

TERMINAL         typewriter queue · syntax highlight · ambient daemon
                 history recall (↑↓) · paste auto-detects JSON payloads

## Writing your own spell

```
register paint-red for(const o of BM.all()){BM.setStroke(o,'#FF0000')}BM.redraw();BM.log('painted red!')
```

Then `$ paint-red` retints everything red.

Available BM API (action-scoped):

```
BM.getSelected()          selected object(s)
BM.all()                  all objects
BM.create(type, props)    spawn circle | square | triangle | arrow | text | sticky
BM.update(idOrObj, patch) bulk-update data attributes
BM.translate(obj, dx, dy) nudge
BM.setStroke(obj, color)  per-object line color
BM.setFill(obj, color)    per-object fill
BM.remove(obj)            delete
BM.clear()                wipe canvas
BM.viewCenter()           { x, y }
BM.rand(min, max)         uniform random
BM.redraw()               repaint (call after mutations)
BM.save()                 commit to undo history
BM.log(msg, cls?)         terminal output ('t-ok' / 't-err' / 't-dim')
args                      string passed at invocation
```

**Note:** `BM.create('rect', ...)` is not supported — use `'square'`. Only the six types listed above are valid.

**Canonical machine-readable spec:** [`spell-spec.md`](./spell-spec.md) · LLM index: [`llms.txt`](./llms.txt)

**Forbidden hallucinated terms** (NOT BMBoard — never use): `internalName`, `displayName`, `description`, `icon`, `category`, `cost`, `mp`, `cooldown`, `PROJECTILE`, `particle`, `onHit`, `magic create`, `/bmboard`, `/reload`, `plugins/`, `skills/`.

## 自分で魔法を作る

```
register paint-red for(const o of BM.all()){BM.setStroke(o,'#FF0000')}BM.redraw();BM.log('painted red!')
```

これで `$ paint-red` を打つと、すべての線が赤くなります。

利用可能な BM API：

```
BM.getSelected()          選択中の物
BM.all()                  全オブジェクト
BM.create(type, props)    生成 (circle | square | triangle | arrow | text | sticky)
BM.update(idOrObj, patch) data 属性を一括更新
BM.translate(obj, dx, dy) 平行移動
BM.setStroke(obj, color)  線の色を変更
BM.setFill(obj, color)    塗りの色を変更
BM.remove(obj)            削除
BM.clear()                キャンバスをクリア
BM.viewCenter()           ビューの中心 { x, y }
BM.rand(min, max)         一様乱数
BM.redraw()               再描画（変更後に呼ぶ）
BM.save()                 Undo 履歴にコミット
BM.log(msg, cls?)         ターミナル出力 ('t-ok' / 't-err' / 't-dim')
args                      呼出し時の引数文字列
```

**機械可読仕様（AI 用）:** <a href="./spell-spec.md"><code>spell-spec.md</code></a> · LLM index: <a href="./llms.txt"><code>llms.txt</code></a>

**禁止語（BMBoard には存在しない、絶対使わない）:** <code>internalName</code>, <code>displayName</code>, <code>description</code>, <code>icon</code>, <code>category</code>, <code>cost</code>, <code>mp</code>, <code>cooldown</code>, <code>PROJECTILE</code>, <code>particle</code>, <code>onHit</code>, <code>magic create</code>, <code>/bmboard</code>, <code>/reload</code>, <code>plugins/</code>, <code>skills/</code>

**注意:** `BM.create('rect', ...)` はサポートされていません。`'square'` を使ってください。上記 5 種類のみ有効。

### Move, Rotate, Resize / 移動・回転・リサイズ

```
S  →  Select tool
   · Click an object or within 8px of its outline to grab it.
   · Drag to move.
   · Drag the ○ handle above the bounding box to rotate.
   · Drag any of the 8 □ anchors to resize.

Modifier keys while resizing:
   Shift         Lock aspect ratio (corner handles).
   Alt / Option  Anchor to the center (symmetric scale).
   Shift + Alt   Both.

Images are aspect-locked on corners by default —
Shift releases the lock, so photos never warp accidentally.
```

### Marquee Selection / 範囲選択

```
Drag on empty canvas  →  dashed selection rectangle.
Any object that the marquee grazes (AABB intersection)  → selected.
After release, drag any selected object to move the whole group.
Group supports rotation + resize just like a single object.
Del / Backspace  → delete all selected.
Esc              → deselect all.
```

## 3. The Terminal Interface / ターミナル

<div class="lang-ja">

<h3>単なるログではない</h3>

<p>Black Mirror のターミナルは「環境音としてのログ」と「入力受付の対話型プロンプト」の二重構造です。入力欄は常に右下にあり、キーボードに触れればいつでもコマンドが打てます。</p>

</div>

<div class="lang-en">

<h3>Not just a log</h3>

<p>The terminal is two things at once: an ambient log that hums with system activity, <strong>and</strong> an interactive prompt that accepts commands. The input is always pinned at the bottom-right.</p>

</div>

### History & recall / 履歴の呼び出し

| Key            | Action                                            |
| -------------- | ------------------------------------------------- |
| `Enter`        | Execute the current input.                        |
| `↑`            | Recall the previous command.                      |
| `↓`            | Return toward the draft / forward through history. |
| `Esc`          | If the USAGE overlay is open, close it first.     |

History is stored in `localStorage` (up to 80 entries) — **survives reload.**

### Built-in commands / 組込みコマンド

```
help                    →  in-terminal cheat sheet (hacker layout)
usage / man / docs      →  summon the USAGE overlay
clear / flush           →  wipe terminal output
light / dark / gray     →  switch canvas theme
list                    →  list every registered command
forget <name>           →  remove a user-registered command
```

## 4. Custom Commands / カスタムコマンドの魔法

<div class="lang-ja">

<h3>核心: 魔法は持ち運べる</h3>

<p>Black Mirror の最大の遊びは、「誰かが作ったコマンドを、SNS 経由で手に入れて、自分のボードで使える」ことです。</p>

</div>

<div class="lang-en">

<h3>The point: magic is portable</h3>

<p>The single most interesting thing about Black Mirror is that <strong>commands travel</strong>. Someone writes a spell, posts it on SNS, and with a single paste your board inherits it.</p>

</div>

### 4.1 Importing a spell / 魔法を拾う

<div class="lang-ja">

<strong>3 ステップ：</strong>
<ol>
<li>X / Discord / Slack などで以下のような JSON を見つける。</li>
<li>ターミナル入力欄にペーストする。</li>
<li>自動で <code>$&lt;name&gt;</code> として登録される。</li>
</ol>

</div>

<div class="lang-en">

<strong>Three steps:</strong>
<ol>
<li>Spot a JSON payload like the one below on social media.</li>
<li>Paste it directly into the terminal input.</li>
<li>It's auto-registered as <code>$&lt;name&gt;</code>.</li>
</ol>

</div>

```json
{
  "command": "scatter",
  "action": "const sel = BM.getSelected();\nfor (const o of sel) BM.translate(o, BM.rand(-400,400), BM.rand(-300,300));\nBM.log('scattered ' + sel.length);"
}
```

Terminal response / ターミナルの応答:

```
paste > [JSON payload intercepted]
→ schema check... { command, action } ✓
→ binding $scatter → sandboxed function...
→ persisting to local storage...
[OK] spell acquired — run: $scatter
```

### 4.2 Exporting a spell / 魔法を放つ

```
share <name>
```

<p class="lang-ja">指定したコマンドの JSON 定義をクリップボードにコピーします。そのまま SNS に貼れば、誰でも拾える呪文として世界に放流できます。</p>

<p class="lang-en">Copies the command's JSON definition to your clipboard. Paste it on SNS and you've just released a spell into the wild.</p>

```
[CLIPBOARD] Copied to clipboard. Paste this on SNS!
───────────────────────────────────────────
{
  "command": "scatter",
  "action": "..."
}
───────────────────────────────────────────
```

### 4.3 Writing your own / 自作する

```
register <name> <javascript action>
```

```
register pulse
  const sel = BM.getSelected();
  for (const o of sel) o.data.rotation = (o.data.rotation || 0) + Math.PI / 8;
```

Inside the action, the **`BM` global** is your interface:

| Method                        | What it does                             |
| ----------------------------- | ---------------------------------------- |
| `BM.getSelected()`            | selected object(s) as an array           |
| `BM.all()`                    | every object on the board                |
| `BM.create(type, props)`      | spawn `circle` / `square` / `triangle` / `arrow` / `text` / `sticky` |
| `BM.translate(obj, dx, dy)`   | nudge an object                          |
| `BM.setStroke(obj, color)`    | per-object line color                    |
| `BM.setFill(obj, color)`      | per-object fill                          |
| `BM.remove(obj)`              | delete an object                         |
| `BM.update(idOrObj, patch)`   | patch object data                        |
| `BM.viewCenter()`             | `{ x, y }` — current view center (world coords) |
| `BM.rand(min, max)`           | uniform random number                    |
| `BM.log(msg, cls?)`           | terminal output (`t-ok` / `t-err` / `t-dim`) |
| `BM.redraw()`                 | force repaint                            |
| `BM.save()`                   | push to undo history                     |
| `args`                        | string passed at invocation              |

### 4.4 Aliasing / 別名

```
alias ripple = scatter
```

<p class="lang-ja">既存コマンドを別の名前で複製します。呪文に自分の名前をつけたい時に。</p>

<p class="lang-en">Duplicates an existing spell under a new name. Brand the magic with your own naming.</p>

## 5. Tutorial — Your First Command / 最初の一手

<div class="lang-ja">

<h3>まずは呪文を撃ってみよう</h3>

<ol>
<li>画面上に適当な図形を <strong>3〜5 個</strong> 描いてください（鉛筆でも矩形でも OK）。</li>
<li>ターミナル入力欄に以下を打ち、<code>Enter</code>：

<li>ターミナルで：

→ 選択したオブジェクトがランダムに散らばります。</li>
<li>気が向いたら：
<pre><code>grid-3x3</code></pre>
→ ビュー中心に 3×3 のマスが整列配置されます。</li>
</ol>

<p><strong>これで、あなたは3つの呪文を既に使ったことになります。</strong></p>

</div>

<div class="lang-en">

<h3>Cast your first spell</h3>

<ol>
<li>Draw <strong>3–5 objects</strong> anywhere on the canvas (pen strokes or squares, both work).</li>

<script type="text/markdown" id="md-spell-spec">
# 魔法の作り方 — BMBoard Spell Spec

> AI agent や人が **Black Mirror Board** の魔法 (spell) を作る時の正解仕様。
> 機械可読 spec: <a href="./spell-spec.md">spell-spec.md</a> / <a href="./spell-spec.html">spell-spec.html</a> · LLM index: <a href="./llms.txt">llms.txt</a>

---

## 0. ⚡ まずはこの 1 行を見て覚える

```json
{"command":"fire","action":"const N=15,vc=BM.viewCenter();const sparks=[];for(let i=0;i<N;i++){const s=BM.create('text',{x:vc.x,y:vc.y,text:'🔥',fontSize:20+Math.random()*20});sparks.push({o:s,vx:(Math.random()-0.5)*15,vy:(Math.random()-0.5)*15});}let f=0;const id=setInterval(()=>{if(f++>40){clearInterval(id);for(const s of sparks){const i=BM.all().indexOf(s.o);if(i>=0)BM.all().splice(i,1);}BM.redraw();BM.log('fire: extinguished.');return;}for(const s of sparks){s.o.data.x+=s.vx;s.o.data.y+=s.vy;s.o.data.fontSize*=0.92;}BM.redraw();},30);BM.log('fire: burst of 15 sparks.');"}
```

学べる原則:
- 魔法は **`{ "command", "action" }` の 2 キーだけの 1 行 JSON**
- `action` は **JS の生コード文字列**
- 典型パターン: `BM.create()` → `setInterval` → 完了時に `BM.all().splice()` で掃除 → `BM.redraw()` 必須

---

## 1. 構造

```
{"command":"NAME","action":"JAVASCRIPT_CODE_STRING"}
```

- `command`: 1〜31 文字、英数字 + `-` `_`。`$NAME` で発火
- `action`: JS コード文字列。`new Function('BM','args',action)` で実行される

**他のフィールドは一切なし**。1 行、Markdown 不要、説明不要。

---

## 2. 登録の 3 通り

| 方法 | 手順 |
|---|---|
| A. JSON ペースト | BMBoard ターミナル入力欄に JSON を貼る → 自動検出 → 自動登録 (Enter 不要) |
| B. ファイルドロップ | `.json` で保存 → ボードにドラッグ&ドロップ |
| C. register コマンド | `register <name> <JS コード>` を 1 行で打つ |

登録後は `$<name>` または `<name>` で発火。

---

## 3. シェア — `share` コマンド

```
share <name>
```

これを打つと:

> **`→ copied to clipboard!` がターミナルに表示される。**
> **同時に、JSON が自動でクリップボードにコピーされている。**

ターミナル上の JSON テキストを「選択 → Cmd+C」しなくていい。`share` コマンド自体がクリップボードに書き込んでくれる。

つまり:

1. `share fire` → クリップボードに `{"command":"fire","action":"..."}` が入る
2. SNS / Discord / Slack を開く
3. **Cmd+V (Mac) / Ctrl+V (Win)** で貼り付ける → 投稿

これで他人が魔法を取り込めるようになる。

---

## 4. 他人の魔法を取り込む

シェアされた JSON を見つけたら:

| 方法 | 手順 |
|---|---|
| A. ペースト | JSON を選択 → Cmd+C → BMBoard ターミナル入力欄に Cmd+V → **Enter 不要、自動登録** |
| B. ファイル | JSON を `.json` で保存 → ボードにドラッグ&ドロップ |

同名の魔法が既にある場合は自動で `<name>_2026-MM-DD` のようにリネーム、preset は上書きされない。

---

## 5. AI に作ってもらう — そのままコピーして使えるプロンプト

```
You are creating a "spell" for BMBoard, a single-page canvas web app.

OUTPUT FORMAT (mandatory):
{"command":"NAME","action":"JAVASCRIPT_CODE_AS_STRING"}

Output 1 line, no Markdown, no explanation, no code fences.

Reference example (your output should look the same shape):
{"command":"fire","action":"const N=15,vc=BM.viewCenter();const sparks=[];for(let i=0;i<N;i++){const s=BM.create('text',{x:vc.x,y:vc.y,text:'🔥',fontSize:20+Math.random()*20});sparks.push({o:s,vx:(Math.random()-0.5)*15,vy:(Math.random()-0.5)*15});}let f=0;const id=setInterval(()=>{if(f++>40){clearInterval(id);for(const s of sparks){const i=BM.all().indexOf(s.o);if(i>=0)BM.all().splice(i,1);}BM.redraw();return;}for(const s of sparks){s.o.data.x+=s.vx;s.o.data.y+=s.vy;s.o.data.fontSize*=0.92;}BM.redraw();},30);"}

API:
- BM.log(msg, cls?)
- BM.viewCenter() → {x, y}
- BM.create(type, props)   // type: 'circle'|'square'|'triangle'|'arrow'|'text'|'sticky'
- BM.translate / update / remove / setStroke / setFill
- BM.all() / BM.getSelected() / BM.clear() / BM.redraw() / BM.save()
- BM.rand(min, max)
- args (string)

Object props:
- circle:   {cx, cy, rx, ry, rotation, fill}
- square:   {x, y, w, h, rotation, fill}
- triangle: {x, y, w, h, rotation, fill}
- arrow:    {x1, y1, x2, y2, rotation}
- text:     {x, y, text, fontSize, rotation}
- sticky:   {x, y, w, h, text, color, rotation}

NEVER use: internalName, displayName, description, icon, category, cost, cooldown,
mp, projectile, particle, onHit, range, power, plugins, skills, magic create,
/bmboard, /reload. Those are NOT BMBoard.

Always end with BM.redraw().

Now create a spell: <DESCRIBE WHAT YOU WANT>
```

AI が出した 1 行 JSON を BMBoard ターミナルにペーストするだけ。

---

## 6. BM API リファレンス

| API | 役割 |
|---|---|
| `BM.log(msg, cls?)` | ターミナル出力 (`'t-ok'`/`'t-err'`/`'t-dim'`) |
| `BM.viewCenter()` | `{x, y}` ビュー中心 |
| `BM.create(type, props)` | キャンバスに新規オブジェクト追加 |
| `BM.translate(obj, dx, dy)` | 平行移動 |
| `BM.update(idOrObj, patch)` | data を部分更新 |
| `BM.remove(obj)` | 削除 |
| `BM.setStroke(obj, color)` | 線色 |
| `BM.setFill(obj, color)` | 塗り色 |
| `BM.all()` | 全オブジェクト配列 |
| `BM.getSelected()` | 選択中の配列 |
| `BM.clear()` | 全消去 |
| `BM.redraw()` | 再描画 (変更後必須) |
| `BM.save()` | undo 履歴に push |
| `BM.rand(min, max)` | 乱数 |
| `args` | `$name foo bar` の `'foo bar'` 部分 |

## 7. オブジェクト型

| `type` | `props` |
|---|---|
| `circle` | `{cx, cy, rx, ry, rotation, fill, strokeOff}` |
| `square` | `{x, y, w, h, rotation, fill, strokeOff}` |
| `triangle` | `{x, y, w, h, rotation, fill, strokeOff}` |
| `arrow` | `{x1, y1, x2, y2, rotation}` |
| `text` | `{x, y, text, fontSize, rotation}` |
| `sticky` | `{x, y, w, h, text, color, rotation}` (default `'#FFE873'`) |

## 8. 禁止語 (BMBoard には存在しない、絶対使わない)

`internalName`, `displayName`, `description`, `icon`, `category`, `cost`, `mp`, `cooldown`, `PROJECTILE`, `particle`, `onHit`, `range`, `power`, `magic create`, `/bmboard`, `/reload`, `plugins/`, `skills/`

これらは Minecraft プラグインや RPG エンジンの用語であり BMBoard には存在しない。AI が hallucinate して出してきたら無視。

---

## 9. 管理コマンド

| コマンド | 動作 |
|---|---|
| `list` | 登録魔法の一覧 (preset / user に分類) |
| `cmds` | 組込みコマンド全一覧 |
| `forget <name>` | user 魔法を削除 (preset は保護) |
| `alias <new>=<old>` | 既存魔法を別名で複製 |
| `share <name>` | 魔法 JSON をクリップボードにコピー |

---

## 10. 動作確認用の最小例

```json
{"command":"hi","action":"const c=BM.viewCenter();BM.create('sticky',{x:c.x-100,y:c.y-100,w:200,h:200,text:'hello'});BM.redraw();BM.log('placed.');"}
```

これをターミナルに貼って `hi` で発火 → 黄色付箋が中央に出ればすべて理解済み。

    const mdBody = document.getElementById('mdBody');
    // README has separate en/ja markdown blocks so the JP/EN toggle can swap
    // the rendered tree wholesale; usage.md is bilingual via .lang-ja/.lang-en spans.
    const currentLang = () => document.documentElement.lang === 'en' ? 'en' : 'ja';
    function resolveId(file) {
        if (file === 'README.md')      return 'md-readme-' + currentLang();
        if (file === 'usage.md')       return 'md-usage';
        if (file === 'spell-spec.md')  return 'md-spell-spec';
        if (file === 'bmbrowser.md')   return 'md-bmbrowser';
        return null;
    }
    let activeFile = 'README.md';

    function loadMd(file) {
        activeFile = file;
        const id = resolveId(file);
        const el = id && document.getElementById(id);
        if (!el) { mdBody.innerHTML = '<p style="color:#666">content not embedded: ' + file + '</p>'; return; }
        mdBody.innerHTML = marked.parse(el.textContent);
        window.scrollTo(0, 0);
    }

    document.querySelectorAll('.tab').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            loadMd(btn.dataset.file);
        });
    });

    // Re-render when lang changes — README needs a different markdown block;
    // usage.md just needs its .lang-ja/.lang-en spans recomputed by CSS, but
    // re-rendering is cheap and keeps both tabs consistent.
    window.addEventListener('bmboard:langchange', () => loadMd(activeFile));

    loadMd('README.md');
</script>

<script>
(function () {
    const KEY = 'bmboard.theme';
    const root = document.documentElement;
    const current = () => root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const apply = (t) => {
        const next = (t === 'light') ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem(KEY, next); } catch {}
    };
    document.querySelectorAll('.theme-toggle .theme-tok').forEach(tok => {
        tok.addEventListener('click', (e) => { e.stopPropagation(); apply(tok.dataset.setTheme); });
    });
    document.getElementById('themeToggle')?.addEventListener('click', (e) => {
        if (e.target.matches('.theme-tok')) return;
        apply(current() === 'dark' ? 'light' : 'dark');
    });
})();
</script>

<script>
(function () {
    const KEY = 'bmboard.lang';
    const root = document.documentElement;
    const current = () => root.lang === 'en' ? 'en' : 'ja';
    const apply = (l) => {
        const next = (l === 'en') ? 'en' : 'ja';
        if (root.lang === next) return;
        root.lang = next;
        try { localStorage.setItem(KEY, next); } catch {}
        window.dispatchEvent(new CustomEvent('bmboard:langchange', { detail: { lang: next } }));
    };
    document.querySelectorAll('.lang-toggle .lang-tok').forEach(tok => {
        tok.addEventListener('click', (e) => { e.stopPropagation(); apply(tok.dataset.setLang); });
    });
    document.getElementById('langToggle')?.addEventListener('click', (e) => {
        if (e.target.matches('.lang-tok')) return;
        apply(current() === 'ja' ? 'en' : 'ja');
    });
})();
</script>
